name: Join ~ring
description: Register your website in ~ring
title: "[Join] "
labels:
  - join
body:
  - type: markdown
    attributes:
      value: |
        Install this marker on your site before submitting:

            <a href="https://github.com/qbju/Webring" data-webring="~ring">~ring</a>

  - type: input
    id: site_name
    attributes:
      label: Site name
      description: The name displayed in the ring.
      placeholder: My Website
    validations:
      required: true

  - type: input
    id: site_url
    attributes:
      label: Site URL
      description: The HTTP(S) URL of the site to register.
      placeholder: https://example.com/
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description of your site.
      placeholder: My personal website about...
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have installed the ~ring marker on the submitted site.
          required: true
        - label: I have checked that the submitted information is correct.
          required: true
