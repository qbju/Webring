name: Validate ~ring applications

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: webring-registry
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && !github.event.issue.locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate application
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_issue.py

      - name: Check registry
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_members.py
