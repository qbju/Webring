<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>~ring Library — Independent Websites</title>
<meta name="description" content="Browse independent websites, personal sites, and small web projects participating in ~ring.">
<link rel="canonical" href="https://tildering.pages.dev/library.html">
<link rel="stylesheet" href="./style.css">
<style>
.library{max-width:960px;width:100%;text-align:left}
.library-header{text-align:center;margin-bottom:2.5rem}
.library-header h1{margin:0 0 1rem;font-size:clamp(2rem,6vw,3rem)}
.library-header p{margin:.5rem auto;max-width:680px}
.library-meta{opacity:.75;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1rem}
.card{border:1px solid #00ff66;padding:1.25rem;background:#000}
.card h2{font-size:1.15rem;margin:0 0 .65rem}
.card p{margin:.65rem 0;line-height:1.6}
.card a{display:inline-block;margin-top:.4rem;font-weight:700}
.status{font-size:.75rem;opacity:.7}
.message{border:1px solid #00ff66;padding:1rem;text-align:center}
.back{text-align:center;margin-top:2rem}
</style>
</head>
<body>
<main>
  <div class="library">
    <header class="library-header">
      <img class="logo" src="./ring.svg" alt="~ring">
      <h1>~ring Library</h1>
      <p>Explore independent websites, personal sites, and small web projects participating in ~ring.</p>
      <p class="library-meta" id="count">Loading members…</p>
    </header>

    <section id="members" class="grid" aria-live="polite">
      <p class="message">Loading the library…</p>
    </section>

    <p class="back"><a href="./">← Back to ~ring</a></p>
  </div>
</main>

<script>
const membersEl = document.getElementById("members");
const countEl = document.getElementById("count");

function text(value) {
  return value == null ? "" : String(value);
}

async function loadMembers() {
  try {
    const response = await fetch("./members.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Failed to load members");
    const data = await response.json();
    const members = Array.isArray(data.members) ? data.members : [];

    countEl.textContent = members.length + (members.length === 1 ? " member" : " members");

    if (!members.length) {
      membersEl.innerHTML = '<p class="message">No members yet.</p>';
      return;
    }

    const fragment = document.createDocumentFragment();

    for (const member of members) {
      const card = document.createElement("article");
      card.className = "card";

      const heading = document.createElement("h2");
      heading.textContent = text(member.name) || "Unnamed site";

      const description = document.createElement("p");
      description.textContent = text(member.description) || "An independent website participating in ~ring.";

      const status = document.createElement("div");
      status.className = "status";
      status.textContent = member.status === "active" ? "Active member" : text(member.status);

      const link = document.createElement("a");
      link.href = text(member.url);
      link.textContent = "Visit site →";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      card.append(heading, description, status, link);
      fragment.appendChild(card);
    }

    membersEl.replaceChildren(fragment);
  } catch (error) {
    countEl.textContent = "Unable to load members";
    membersEl.innerHTML = '<p class="message">The library is temporarily unavailable. Please try again later.</p>';
  }
}

loadMembers();
</script>
</body>
</html>
