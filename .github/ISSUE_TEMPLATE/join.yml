name: Join ~ring
description: Register your website in ~ring
title: "[Join] "
labels:
  - join
body:
  - type: markdown
    attributes:
      value: |
        Install this marker on your site before submitting:

            <nav id="~ring"></nav>
            <script src="https://tildering.pages.dev/widget.js" data-webring="~ring"></script>

        Optional widget settings:

            data-webring-style="text"
            data-webring-style="buttons"
            data-webring-style="stacked"
            data-webring-logo="true"

        These settings only change the appearance of the widget.

  - type: input
    id: site_name
    attributes:
      label: Site name
      description: The name displayed in the ring.
      placeholder: My Website
    validations:
      required: true

  - type: input
    id: site_url
    attributes:
      label: Site URL
      description: The HTTP(S) URL of the site to register.
      placeholder: https://example.com/
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description of your site.
      placeholder: My personal website about...
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have installed the ~ring marker on the submitted site.
          required: true
        - label: I have checked that the submitted information is correct.
          required: true
